<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="noise"></div>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark">E</div>
      <div>
        <h1>Expense Tracker</h1>
        <p>your day, accounted for</p>
      </div>
    </div>
    <div class="theme-toggle">
      <button id="btn-dark" title="Dark mode">🌙</button>
      <button id="btn-light" title="Light mode">☀️</button>
    </div>
  </header>

  <div class="grid">
    <!-- LEFT COLUMN -->
    <div style="display:flex; flex-direction:column; gap:22px;">

      <div class="card hero-card">
        <div class="eyebrow">Today's spending</div>
        <div class="dial-wrap">
          <svg viewBox="0 0 220 220">
            <circle class="dial-bg" cx="110" cy="110" r="94"></circle>
            <circle class="dial-fg" id="dialFg" cx="110" cy="110" r="94" stroke-dasharray="590" stroke-dashoffset="590"></circle>
          </svg>
          <div class="dial-center">
            <div class="amt" id="dialAmount">₹0</div>
            <div class="lbl" id="dialLabel">of ₹0 budget</div>
          </div>
        </div>
        <div class="dial-sub" id="dialSub">Set a daily budget to track your pace.</div>

        <div class="stat-row">
          <div class="stat">
            <div class="v" id="statWeek">₹0</div>
            <div class="k">This week</div>
          </div>
          <div class="stat">
            <div class="v" id="statMonth">₹0</div>
            <div class="k">This month</div>
          </div>
        </div>

        <div class="budget-edit">
          Monthly budget:
          <input type="number" id="budgetInput" placeholder="e.g. 30000" min="0">
        </div>
      </div>

      <div class="card">
        <h2>Where it's going</h2>
        <div id="categoryBreakdown"></div>
      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div style="display:flex; flex-direction:column; gap:22px;">

      <div class="card">
        <h2>Add an expense</h2>
        <form id="expenseForm">
          <div class="row2">
            <div>
              <label>Amount</label>
              <div class="amount-input">
                <span>₹</span>
                <input type="number" id="amountInput" step="0.01" min="0.01" placeholder="0.00" required>
              </div>
            </div>
            <div>
              <label>Date</label>
              <input type="date" id="dateInput" required>
            </div>
          </div>

          <div>
            <label>Category</label>
            <div class="cat-picker" id="catPicker"></div>
          </div>

          <div>
            <label>Note (optional)</label>
            <input type="text" id="noteInput" placeholder="Add a note" maxlength="60">
          </div>

          <button type="submit" class="submit-btn">Add expense</button>
        </form>
      </div>

      <div class="card ledger-section">
        <h2>Recent transactions</h2>
        <div id="ledgerList"></div>
      </div>

    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
